name: MoneyFlow
options:
  bundleIdPrefix: com.moneyflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 5M726V7N7X
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MoneyFlow:
    type: application
    platform: iOS
    sources:
      - path: MoneyFlow
    dependencies:
      - target: MoneyFlowWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyflow.app
        INFOPLIST_KEY_CFBundleDisplayName: "MoneyFlow"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSFaceIDUsageDescription: "MoneyFlow 需要使用面容 ID 保护您的资产与财务数据隐私。"

  MoneyFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MoneyFlowWidgets
      - path: MoneyFlow/Models/WidgetSnapshotData.swift
    settings:
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: MoneyFlowWidgets/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.moneyflow.app.widgets
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0

  MoneyFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyFlowTests
    dependencies:
      - target: MoneyFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyflow.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MoneyFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MoneyFlow"

  MoneyFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoneyFlowUITests
    dependencies:
      - target: MoneyFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyflow.uitests
        TEST_TARGET_NAME: MoneyFlow
